<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1080" width="1360" height="1080" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <marker id="f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="glow5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1360" height="1080" fill="url(#bg5)"/>

  <text x="48" y="52" fill="#dce4f0" font-size="26" font-weight="700" letter-spacing="1">Seis productos llaman de seis maneras a la misma persona</text>
  <text x="48" y="78" fill="#8b98ad" font-size="14">Ese es el problema real de un SOC con varias herramientas: nadie ve al usuario entero. Aquí se arregla en la normalización.</text>

  <!-- ================= los cuatro SIEM ================= -->
  <text x="48" y="106" fill="#5b6880" font-size="11" letter-spacing="2">LOS CUATRO SIEM · CADA UNO VE BIEN UNA PARTE</text>

  <g transform="translate(48,118)">
    <rect width="296" height="318" rx="12" fill="#0d121c" stroke="#65a637" stroke-opacity="0.35"/>
    <circle cx="30" cy="34" r="11" fill="#65a637"/>
    <text x="52" y="40" fill="#dce4f0" font-size="17" font-weight="700">Splunk</text>
    <text x="20" y="70" fill="#5b6880" font-size="10.5" letter-spacing="1.5">QUÉ APORTA MEJOR</text>
    <text x="20" y="92" fill="#94a3b8" font-size="12">Detalle de endpoint Windows:</text>
    <text x="20" y="110" fill="#94a3b8" font-size="12">Sysmon, 4688, líneas de comando</text>
    <text x="20" y="128" fill="#94a3b8" font-size="12">completas, árbol de procesos.</text>
    <text x="20" y="158" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO SE PREGUNTA</text>
    <rect x="20" y="170" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="191" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">SPL · REST :8089</text>
    <text x="20" y="228" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO LLAMA AL USUARIO</text>
    <rect x="20" y="240" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="261" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">CORP\jlopez</text>
    <text x="20" y="296" fill="#5b6880" font-size="11">Punto flojo: poca visión de identidad cloud.</text>
  </g>

  <g transform="translate(372,118)">
    <rect width="296" height="318" rx="12" fill="#0d121c" stroke="#0078d4" stroke-opacity="0.35"/>
    <circle cx="30" cy="34" r="11" fill="#0078d4"/>
    <text x="52" y="40" fill="#dce4f0" font-size="17" font-weight="700">Sentinel / Defender</text>
    <text x="20" y="70" fill="#5b6880" font-size="10.5" letter-spacing="1.5">QUÉ APORTA MEJOR</text>
    <text x="20" y="92" fill="#94a3b8" font-size="12">Identidad, correo y cloud: inicios</text>
    <text x="20" y="110" fill="#94a3b8" font-size="12">de sesión, phishing entregado,</text>
    <text x="20" y="128" fill="#94a3b8" font-size="12">alertas del EDR ya correlacionadas.</text>
    <text x="20" y="158" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO SE PREGUNTA</text>
    <rect x="20" y="170" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="191" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">KQL · Log Analytics</text>
    <text x="20" y="228" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO LLAMA AL USUARIO</text>
    <rect x="20" y="240" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="261" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">jlopez@corp.com</text>
    <text x="20" y="296" fill="#5b6880" font-size="11">Punto flojo: todo lo que no es Microsoft.</text>
  </g>

  <g transform="translate(696,118)">
    <rect width="296" height="318" rx="12" fill="#0d121c" stroke="#1f70c1" stroke-opacity="0.35"/>
    <circle cx="30" cy="34" r="11" fill="#1f70c1"/>
    <text x="52" y="40" fill="#dce4f0" font-size="17" font-weight="700">IBM QRadar</text>
    <text x="20" y="70" fill="#5b6880" font-size="10.5" letter-spacing="1.5">QUÉ APORTA MEJOR</text>
    <text x="20" y="92" fill="#94a3b8" font-size="12">Red y perímetro: quién habló con</text>
    <text x="20" y="110" fill="#94a3b8" font-size="12">quién y cuántos bytes. Ofensas ya</text>
    <text x="20" y="128" fill="#94a3b8" font-size="12">agrupadas con su magnitud.</text>
    <text x="20" y="158" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO SE PREGUNTA</text>
    <rect x="20" y="170" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="191" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">AQL · Ariel</text>
    <text x="20" y="228" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO LLAMA AL USUARIO</text>
    <rect x="20" y="240" width="256" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="261" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">10.4.2.11</text>
    <text x="20" y="296" fill="#5b6880" font-size="11">Punto flojo: identifica por IP, no por nombre.</text>
  </g>

  <g transform="translate(1020,118)">
    <rect width="292" height="318" rx="12" fill="#0d121c" stroke="#94a3b8" stroke-opacity="0.30"/>
    <circle cx="30" cy="34" r="11" fill="#94a3b8"/>
    <text x="52" y="40" fill="#dce4f0" font-size="17" font-weight="700">CEF / LEEF / syslog</text>
    <text x="20" y="70" fill="#5b6880" font-size="10.5" letter-spacing="1.5">QUÉ APORTA MEJOR</text>
    <text x="20" y="92" fill="#94a3b8" font-size="12">Todo lo demás: cortafuegos, proxy,</text>
    <text x="20" y="110" fill="#94a3b8" font-size="12">antivirus, VPN, cabinas. El comodín</text>
    <text x="20" y="128" fill="#94a3b8" font-size="12">para lo que no tiene conector.</text>
    <text x="20" y="158" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO SE PREGUNTA</text>
    <rect x="20" y="170" width="252" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="191" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">fichero o syslog crudo</text>
    <text x="20" y="228" fill="#5b6880" font-size="10.5" letter-spacing="1.5">CÓMO LLAMA AL USUARIO</text>
    <rect x="20" y="240" width="252" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="261" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">jlopez</text>
    <text x="20" y="296" fill="#5b6880" font-size="11">Punto flojo: cada fabricante lo estira a su gusto.</text>
  </g>

  <!-- ================= los dos proxies SASE ================= -->
  <text x="48" y="474" fill="#5b6880" font-size="11" letter-spacing="2">LOS DOS PROXIES SASE · NO SON UN QUINTO SIEM, SON OTRA LENTE</text>

  <g transform="translate(48,486)">
    <rect width="620" height="146" rx="12" fill="#0d121c" stroke="#ff6600" stroke-opacity="0.35"/>
    <circle cx="30" cy="32" r="11" fill="#ff6600"/>
    <text x="52" y="38" fill="#dce4f0" font-size="17" font-weight="700">Netskope</text>
    <text x="180" y="38" fill="#5b6880" font-size="11.5" font-family="Consolas, monospace">API v2 · iterador con estado</text>
    <text x="20" y="66" fill="#94a3b8" font-size="12">Lo que ningún SIEM da: la aplicación cloud concreta y la acción</text>
    <text x="20" y="84" fill="#94a3b8" font-size="12">dentro de ella. Subir, descargar, compartir, con los bytes en cada sentido.</text>
    <rect x="20" y="96" width="290" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="117" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">jlopez@corp.local</text>
    <text x="326" y="110" fill="#5b6880" font-size="11">Trae la identidad ya resuelta:</text>
    <text x="326" y="126" fill="#5b6880" font-size="11">no hay que deducirla del DHCP.</text>
  </g>

  <g transform="translate(692,486)">
    <rect width="620" height="146" rx="12" fill="#0d121c" stroke="#0093d0" stroke-opacity="0.35"/>
    <circle cx="30" cy="32" r="11" fill="#0093d0"/>
    <text x="52" y="38" fill="#dce4f0" font-size="17" font-weight="700">Zscaler</text>
    <text x="152" y="38" fill="#5b6880" font-size="11.5" font-family="Consolas, monospace">ZIA empuja por NSS · ZPA por API</text>
    <text x="20" y="66" fill="#94a3b8" font-size="12">Tapa el hueco que no se nota: un equipo con el cliente puesto NO pasa</text>
    <text x="20" y="84" fill="#94a3b8" font-size="12">por el cortafuegos de la oficina, así que ese tráfico no existía en el grafo.</text>
    <rect x="20" y="96" width="290" height="32" rx="5" fill="#121927" stroke="#2a3547"/>
    <text x="32" y="117" fill="#fbbf24" font-size="12.5" font-family="Consolas, monospace">jlopez@corp.local</text>
    <text x="326" y="110" fill="#5b6880" font-size="11">Y la IP pública del túnel, que es</text>
    <text x="326" y="126" fill="#5b6880" font-size="11">por donde sale a Internet.</text>
  </g>

  <!-- flechas convergentes -->
  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#f5)" opacity="0.85">
    <path d="M196,436 C196,468 560,462 596,660"/>
    <path d="M520,436 C520,466 640,470 656,660"/>
    <path d="M844,436 C844,466 724,470 708,660"/>
    <path d="M1166,436 C1166,468 800,462 764,660"/>
    <path d="M358,632 C358,650 600,650 620,660"/>
    <path d="M1002,632 C1002,650 760,650 740,660"/>
  </g>

  <!-- ================= el punto de unión ================= -->
  <g transform="translate(430,668)">
    <rect width="504" height="120" rx="12" fill="#0f1a1a" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <circle cx="36" cy="42" r="9" fill="#2dd4bf" filter="url(#glow5)"/>
    <text x="60" y="48" fill="#2dd4bf" font-size="17" font-weight="700">Canonización</text>
    <text x="24" y="78" fill="#8b98ad" font-size="12">Se recorta el dominio, se baja a minúsculas, se resuelve el alias.</text>
    <text x="24" y="100" fill="#dce4f0" font-size="13">Y las seis formas caen en <tspan fill="#2dd4bf" font-weight="600" font-family="Consolas, monospace">user:jlopez</tspan> — un nodo, no seis.</text>
  </g>

  <!-- ================= resultado ================= -->
  <g transform="translate(48,824)">
    <rect width="620" height="200" rx="12" fill="#0d121c" stroke="#1d2635"/>
    <text x="22" y="30" fill="#5b6880" font-size="11" letter-spacing="2">LO QUE VE EL ANALISTA</text>

    <g transform="translate(120,104)">
      <line x1="0" y1="0" x2="-74" y2="-38" stroke="#65a637" stroke-width="1.6"/>
      <line x1="0" y1="0" x2="-74" y2="6" stroke="#0078d4" stroke-width="1.6"/>
      <line x1="0" y1="0" x2="-74" y2="46" stroke="#1f70c1" stroke-width="1.6"/>
      <line x1="0" y1="0" x2="80" y2="-38" stroke="#94a3b8" stroke-width="1.6"/>
      <line x1="0" y1="0" x2="80" y2="6" stroke="#ff6600" stroke-width="1.6"/>
      <line x1="0" y1="0" x2="80" y2="46" stroke="#0093d0" stroke-width="1.6"/>
      <circle cx="-74" cy="-38" r="7" fill="#65a637"/>
      <circle cx="-74" cy="6" r="7" fill="#0078d4"/>
      <circle cx="-74" cy="46" r="7" fill="#1f70c1"/>
      <circle cx="80" cy="-38" r="7" fill="#94a3b8"/>
      <circle cx="80" cy="6" r="7" fill="#ff6600"/>
      <circle cx="80" cy="46" r="7" fill="#0093d0"/>
      <g transform="translate(-13,-26)">
        <ellipse cx="13" cy="-4" rx="13" ry="3.5" fill="none" stroke="#4ea8ff" stroke-width="2"/>
        <circle cx="13" cy="9" r="8" fill="#4ea8ff"/>
        <path d="M2,36 C2,22 24,22 24,36 Z" fill="#4ea8ff"/>
      </g>
      <text x="0" y="50" fill="#dce4f0" font-size="12" font-weight="600" text-anchor="middle">jlopez</text>
    </g>

    <text x="256" y="66" fill="#dce4f0" font-size="13" font-weight="600">Una sola persona</text>
    <text x="256" y="90" fill="#8b98ad" font-size="12">con las seis fuentes colgando de ella.</text>
    <text x="256" y="114" fill="#8b98ad" font-size="12">Cada arista conserva de qué producto salió,</text>
    <text x="256" y="132" fill="#8b98ad" font-size="12">así que siempre se puede volver al log.</text>
    <text x="256" y="164" fill="#5b6880" font-size="11.5">Medido sobre las muestras: grado 27,</text>
    <text x="256" y="180" fill="#5b6880" font-size="11.5">visto por cuatro productos a la vez.</text>
  </g>

  <g transform="translate(692,824)">
    <rect width="620" height="200" rx="12" fill="#0d121c" stroke="#1d2635"/>
    <text x="22" y="30" fill="#5b6880" font-size="11" letter-spacing="2">LAS TRES FUSIONES, Y SU LÍMITE</text>
    <g font-size="12" fill="#8b98ad">
      <text x="22" y="58"><tspan fill="#2dd4bf">▸</tspan> <tspan fill="#dce4f0" font-family="Consolas, monospace">10.4.1.5</tspan> se funde en <tspan fill="#dce4f0" font-family="Consolas, monospace">srv-dc01</tspan> si algún evento declara esa IP.</text>
      <text x="22" y="82"><tspan fill="#2dd4bf">▸</tspan> Dos ficheros con el mismo hash son el mismo fichero, aunque cambie la ruta.</text>
      <text x="22" y="106"><tspan fill="#2dd4bf">▸</tspan> Dos procesos con el mismo nombre en el mismo equipo y ventana, se unen.</text>
    </g>
    <rect x="22" y="120" width="576" height="30" rx="5" fill="#160d12" stroke="#7f1d1d" stroke-opacity="0.5"/>
    <text x="34" y="140" fill="#ff8fa3" font-size="11.5">Ante la duda, NO se funde. Dos nodos de más molestan; uno de menos esconde el ataque.</text>
    <text x="22" y="174" fill="#5b6880" font-size="11.5">La aplicación cloud NO se funde con una máquina: Dropbox no es un equipo, y</text>
    <text x="22" y="190" fill="#5b6880" font-size="11.5">meterla como host llenaba el grafo de servidores que no existen.</text>
  </g>
</svg>
