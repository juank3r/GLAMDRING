    </marker>
    <marker id="f4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/>
    </marker>
    <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1360" height="840" fill="url(#bg4)"/>

  <text x="48" y="52" fill="#dce4f0" font-size="26" font-weight="700" letter-spacing="1">El cortafuegos ve lo que el endpoint no</text>
  <text x="48" y="78" fill="#8b98ad" font-size="14">Un log de firewall no dice qué proceso fue. Pero dice cuándo, cuánto y hacia dónde — y eso es media investigación.</text>

