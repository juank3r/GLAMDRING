<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" width="1360" height="860" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="f3v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1360" height="860" fill="url(#bg3)"/>

  <text x="48" y="52" fill="#dce4f0" font-size="26" font-weight="700" letter-spacing="1">Cómo se dibuja el grafo</text>
  <text x="48" y="78" fill="#8b98ad" font-size="14">Sin npm, sin compilación, sin paquetes. El navegador carga módulos ES directamente y three.js hace el resto.</text>

  <!-- ================== columna izquierda: la pila ================== -->
  <rect x="48" y="106" width="420" height="518" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="70" y="134" fill="#5b6880" font-size="11" letter-spacing="2">LA PILA, DE ABAJO A ARRIBA</text>

  <!-- capa 1 -->
  <g transform="translate(70,152)">
    <rect width="376" height="66" rx="8" fill="#121927" stroke="#2a3547"/>
    <rect x="0" y="0" width="4" height="66" rx="2" fill="#64748b"/>
    <text x="20" y="28" fill="#dce4f0" font-size="14" font-weight="600">FastAPI sirve web/ como estáticos</text>
    <text x="20" y="48" fill="#8b98ad" font-size="11.5">Hace falta HTTP: los módulos ES no van con file://</text>
  </g>
  <!-- capa 2 -->
  <g transform="translate(70,230)">
    <rect width="376" height="80" rx="8" fill="#121927" stroke="#2a3547"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#8b5cf6"/>
    <text x="20" y="28" fill="#dce4f0" font-size="14" font-weight="600">importmap resuelve los nombres</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">"three" → ./js/vendor/three.module.js</text>
    <text x="20" y="65" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">"three/addons/" → ./js/vendor/jsm/</text>
  </g>
  <!-- capa 3 -->
  <g transform="translate(70,322)">
    <rect width="376" height="80" rx="8" fill="#0f1a1a" stroke="#0f766e"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#2dd4bf"/>
    <text x="20" y="28" fill="#2dd4bf" font-size="14" font-weight="600">three.js r168</text>
    <text x="20" y="48" fill="#8b98ad" font-size="11.5">La revisión está fijada a propósito: es la misma</text>
    <text x="20" y="65" fill="#8b98ad" font-size="11.5">que lleva dentro 3d-force-graph 1.73.4.</text>
  </g>
  <!-- capa 4 -->
  <g transform="translate(70,414)">
    <rect width="376" height="80" rx="8" fill="#121927" stroke="#2a3547"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#4ea8ff"/>
    <text x="20" y="28" fill="#dce4f0" font-size="14" font-weight="600">3d-force-graph (UMD)</text>
    <text x="20" y="48" fill="#8b98ad" font-size="11.5">Simulación de fuerzas, cámara y picking.</text>
    <text x="20" y="65" fill="#94a3b8" font-size="11" font-family="Consolas, monospace">ForceGraph3D(opciones)(contenedor)</text>
  </g>
  <!-- capa 5 -->
  <g transform="translate(70,506)">
    <rect width="376" height="96" rx="8" fill="#121927" stroke="#2a3547"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#fb923c"/>
    <text x="20" y="28" fill="#dce4f0" font-size="14" font-weight="600">Nuestro código</text>
    <text x="20" y="50" fill="#8b98ad" font-size="11.5">models.js · links.js · colors.js · forces.js</text>
    <text x="20" y="68" fill="#8b98ad" font-size="11.5">sprites.js · graph3d.js · ui/*.js</text>
    <text x="20" y="86" fill="#5b6880" font-size="11">Todos los campos que añadimos van con prefijo __gd</text>
  </g>

  <!-- flechas verticales -->
  <g stroke="#8b5cf6" stroke-width="1.8" fill="none" marker-end="url(#f3v)" opacity="0.7">
    <path d="M258,220 L258,226"/><path d="M258,312 L258,318"/>
    <path d="M258,404 L258,410"/><path d="M258,496 L258,502"/>
  </g>

  <!-- ================== centro: del nodo a la figura ================== -->
  <rect x="496" y="106" width="404" height="518" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="518" y="134" fill="#5b6880" font-size="11" letter-spacing="2">DE UN NODO A UNA FIGURA</text>

  <!-- dato -->
  <g transform="translate(518,152)">
    <rect width="360" height="80" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#5b6880" font-size="10">EL BACKEND DICE</text>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">
      <text x="16" y="44">type: "host"   role: "victim"</text>
      <text x="16" y="62">risk: 82   tactics: ["execution"]</text>
    </g>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#f3)"><path d="M698,236 L698,252"/></g>

  <!-- decision -->
  <g transform="translate(518,258)">
    <rect width="360" height="72" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#5b6880" font-size="10">EL FRONTEND DECIDE</text>
    <text x="16" y="46" fill="#dce4f0" font-size="12.5">El <tspan fill="#4ea8ff">tipo</tspan> elige la figura. El <tspan fill="#ff2d55">papel</tspan> elige la variante.</text>
    <text x="16" y="64" fill="#8b98ad" font-size="11.5">Mismo host: sano es gris, víctima tiene la pantalla roja.</text>
  </g>
  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#f3)"><path d="M698,334 L698,350"/></g>

  <!-- figuras -->
  <g transform="translate(518,356)">
    <rect width="360" height="132" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#5b6880" font-size="10">SE COMPONE UN THREE.GROUP CON PRIMITIVAS</text>

    <!-- mini puesto sano -->
    <g transform="translate(40,44)">
      <rect x="0" y="0" width="30" height="20" rx="2" fill="#5b6880"/>
      <rect x="11" y="20" width="8" height="5" fill="#5b6880"/>
      <rect x="2" y="27" width="26" height="3" fill="#5b6880"/>
      <text x="15" y="48" fill="#8b98ad" font-size="10" text-anchor="middle">sano</text>
    </g>
    <!-- mini puesto victima -->
    <g transform="translate(120,44)">
      <rect x="0" y="0" width="30" height="20" rx="2" fill="#ff2d55" filter="url(#glow3)"/>
      <rect x="11" y="20" width="8" height="5" fill="#7f1d1d"/>
      <rect x="2" y="27" width="26" height="3" fill="#7f1d1d"/>
      <text x="15" y="48" fill="#ff8fa3" font-size="10" text-anchor="middle">víctima</text>
    </g>
    <!-- persona buena -->
    <g transform="translate(206,42)">
      <ellipse cx="12" cy="-3" rx="12" ry="3" fill="none" stroke="#4ea8ff" stroke-width="2"/>
      <circle cx="12" cy="9" r="7" fill="#4ea8ff"/>
      <path d="M2,32 C2,20 22,20 22,32 Z" fill="#4ea8ff"/>
      <text x="12" y="50" fill="#8b98ad" font-size="10" text-anchor="middle">legítimo</text>
    </g>
    <!-- persona mala: la capucha es un aro rojo con la cara en sombra dentro,
         que a tamano pequeno se lee mucho mejor que un cono sobre la cabeza -->
    <g transform="translate(280,40)">
      <path d="M1,34 C1,22 23,22 23,34 Z" fill="#ff2d55"/>
      <path d="M12,0 C19,0 23,6 23,13 C23,20 19,24 12,24 C5,24 1,20 1,13 C1,6 5,0 12,0 Z" fill="#ff2d55"/>
      <ellipse cx="12" cy="13" rx="6.5" ry="7.5" fill="#2b0a12"/>
      <text x="12" y="52" fill="#ff8fa3" font-size="10" text-anchor="middle">hostil</text>
    </g>

    <text x="16" y="118" fill="#5b6880" font-size="11">Cero ficheros de modelo. Se puede subir un .glb para sustituir cualquier tipo.</text>
  </g>

  <!-- calidad -->
  <g transform="translate(518,504)">
    <rect width="360" height="98" rx="8" fill="#0f1a1a" stroke="#0f766e"/>
    <text x="16" y="24" fill="#2dd4bf" font-size="12" font-weight="600">Tres calidades, y degradación automática</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11.5"><tspan fill="#dce4f0">alta</tspan> — figura completa con detalles y emisivos</text>
    <text x="16" y="64" fill="#8b98ad" font-size="11.5"><tspan fill="#dce4f0">media</tspan> — figura simplificada</text>
    <text x="16" y="82" fill="#8b98ad" font-size="11.5"><tspan fill="#dce4f0">baja</tspan> — icono plano en sprite, para grafos enormes</text>
  </g>

  <!-- ================== derecha: las cuatro vistas ================== -->
  <rect x="928" y="106" width="384" height="518" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="950" y="134" fill="#5b6880" font-size="11" letter-spacing="2">LOS MISMOS DATOS, CUATRO VISTAS</text>

  <g transform="translate(950,152)">
    <rect width="340" height="106" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="26" fill="#dce4f0" font-size="14" font-weight="600">Exploración 3D</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11.5">Fuerzas libres. ¿Qué toca qué?</text>
    <g transform="translate(248,20)" opacity="0.9">
      <line x1="0" y1="18" x2="30" y2="6" stroke="#2a3547" stroke-width="1.5"/>
      <line x1="30" y1="6" x2="58" y2="24" stroke="#2a3547" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="26" y2="36" stroke="#2a3547" stroke-width="1.5"/>
      <line x1="26" y1="36" x2="58" y2="24" stroke="#2a3547" stroke-width="1.5"/>
      <circle cx="0" cy="18" r="5.5" fill="#4ea8ff"/><circle cx="30" cy="6" r="5.5" fill="#4ade80"/>
      <circle cx="58" cy="24" r="5.5" fill="#ff2d55"/><circle cx="26" cy="36" r="5.5" fill="#fb923c"/>
    </g>
    <text x="16" y="94" fill="#5b6880" font-size="11">forceCollide propio: las figuras ocupan volumen</text>
  </g>

  <g transform="translate(950,272)">
    <rect width="340" height="106" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="26" fill="#dce4f0" font-size="14" font-weight="600">Kill-chain</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11.5">Capas MITRE en orden de ataque.</text>
    <g transform="translate(206,18)">
      <line x1="0" y1="8" x2="118" y2="8" stroke="#1d2635"/>
      <line x1="0" y1="26" x2="118" y2="26" stroke="#1d2635"/>
      <line x1="0" y1="44" x2="118" y2="44" stroke="#1d2635"/>
      <circle cx="18" cy="8" r="5" fill="#4ade80"/><circle cx="46" cy="8" r="5" fill="#4ade80"/>
      <circle cx="62" cy="26" r="5" fill="#fb923c"/><circle cx="90" cy="26" r="5" fill="#fb923c"/>
      <circle cx="104" cy="44" r="5" fill="#ff2d55"/>
    </g>
    <text x="16" y="94" fill="#5b6880" font-size="11">dagMode con onDagError: los ciclos no la rompen</text>
  </g>

  <g transform="translate(950,392)">
    <rect width="340" height="106" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="26" fill="#dce4f0" font-size="14" font-weight="600">Línea temporal</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11.5">Histograma más la tabla de logs en crudo.</text>
    <g transform="translate(206,58)">
      <rect x="0" y="18" width="9" height="10" fill="#1e3a5f"/><rect x="13" y="10" width="9" height="18" fill="#1d4ed8"/>
      <rect x="26" y="2" width="9" height="26" fill="#fb923c"/><rect x="39" y="14" width="9" height="14" fill="#1d4ed8"/>
      <rect x="52" y="6" width="9" height="22" fill="#ff2d55"/><rect x="65" y="20" width="9" height="8" fill="#1e3a5f"/>
      <rect x="78" y="16" width="9" height="12" fill="#1d4ed8"/><rect x="91" y="22" width="9" height="6" fill="#1e3a5f"/>
    </g>
    <text x="16" y="94" fill="#5b6880" font-size="11">Del pico al log original en dos clics</text>
  </g>

  <g transform="translate(950,512)">
    <rect width="340" height="90" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="26" fill="#dce4f0" font-size="14" font-weight="600">Reproducción</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11.5">El incidente ocurre otra vez, en orden.</text>
    <text x="16" y="70" fill="#5b6880" font-size="11">El trazado no se mueve: solo aparece lo ya ocurrido</text>
  </g>

  <!-- ================== franja inferior: trampas ================== -->
  <rect x="48" y="652" width="1264" height="172" rx="12" fill="#160d12" stroke="#7f1d1d" stroke-opacity="0.5"/>
  <text x="70" y="682" fill="#ff2d55" font-size="12" font-weight="700" letter-spacing="1.5">TRES TRAMPAS QUE COSTARON CARO — ANOTADAS PARA QUE NO SE REPITAN</text>

  <g transform="translate(70,700)">
    <rect width="392" height="104" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#dce4f0" font-size="12.5" font-weight="600">El constructor equivocado no da error</text>
    <text x="16" y="46" fill="#94a3b8" font-size="10.5" font-family="Consolas, monospace"><tspan fill="#ff2d55">new</tspan> ForceGraph3D(elem, opts)  ✗</text>
    <text x="16" y="64" fill="#94a3b8" font-size="10.5" font-family="Consolas, monospace">ForceGraph3D(opts)(elem)     ✓</text>
    <text x="16" y="88" fill="#8b98ad" font-size="11">Con la forma mala no se crea el canvas y la consola calla.</text>
  </g>

  <g transform="translate(486,700)">
    <rect width="392" height="104" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#dce4f0" font-size="12.5" font-weight="600">Los nombres de campo chocan</text>
    <text x="16" y="46" fill="#94a3b8" font-size="10.5" font-family="Consolas, monospace">link.__curve   ✗ ya es de la librería</text>
    <text x="16" y="64" fill="#94a3b8" font-size="10.5" font-family="Consolas, monospace">link.__gdCurve ✓</text>
    <text x="16" y="88" fill="#8b98ad" font-size="11">Pisarlo llenaba la consola de «radius is NaN».</text>
  </g>

  <g transform="translate(902,700)">
    <rect width="392" height="104" rx="8" fill="#121927" stroke="#2a3547"/>
    <text x="16" y="24" fill="#dce4f0" font-size="12.5" font-weight="600">Un NaN mata el objeto para siempre</text>
    <text x="16" y="46" fill="#8b98ad" font-size="11">Si se calcula geometría antes de que la simulación</text>
    <text x="16" y="63" fill="#8b98ad" font-size="11">asigne coordenadas, el objeto desaparece y no vuelve.</text>
    <text x="16" y="88" fill="#94a3b8" font-size="10.5" font-family="Consolas, monospace">usable(nodo) antes de tocar posiciones</text>
  </g>
</svg>
