<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="1360" height="820" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="f2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6880"/>
    </marker>
  </defs>
  <rect width="1360" height="820" fill="url(#bg2)"/>

  <text x="48" y="52" fill="#dce4f0" font-size="26" font-weight="700" letter-spacing="1">De un log plano a un grafo que se entiende</text>
  <text x="48" y="78" fill="#8b98ad" font-size="14">Seis etapas. Cada una tiene un contrato de entrada y salida, y por eso cada una se puede probar sola.</text>

  <!-- ============ carril de etapas ============ -->
  <g id="etapas">
    <!-- 1 INGESTA -->
    <g transform="translate(48,120)">
      <rect width="196" height="238" rx="12" fill="#0d121c" stroke="#1d2635"/>
      <rect x="0" y="0" width="196" height="4" rx="2" fill="#64748b"/>
      <text x="18" y="34" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">01 · INGESTA</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">Traer los registros</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">Conector en vivo (SPL, KQL,</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">AQL) o fichero exportado.</text>
      <text x="18" y="133" fill="#8b98ad" font-size="11.5">JSON, JSONL, CSV, syslog</text>
      <text x="18" y="150" fill="#8b98ad" font-size="11.5">crudo — todo entra.</text>
      <rect x="18" y="172" width="160" height="48" rx="6" fill="#121927" stroke="#2a3547"/>
      <text x="28" y="190" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="208" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">list[dict] crudo</text>
    </g>

    <!-- 2 DETECCION -->
    <g transform="translate(268,120)">
      <rect width="196" height="238" rx="12" fill="#0d121c" stroke="#1d2635"/>
      <rect x="0" y="0" width="196" height="4" rx="2" fill="#8b5cf6"/>
      <text x="18" y="34" fill="#8b5cf6" font-size="11" font-weight="700" letter-spacing="1.5">02 · DETECCIÓN</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">¿De quién es esto?</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">Cada normalizador declara</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">matches(). Se prueba en</text>
      <text x="18" y="126" fill="#8b98ad" font-size="11.5">orden y gana el primero</text>
      <text x="18" y="143" fill="#8b98ad" font-size="11.5">que sepa leerlo.</text>
      <rect x="18" y="172" width="160" height="48" rx="6" fill="#121927" stroke="#2a3547"/>
      <text x="28" y="190" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="208" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">(registro, formato)</text>
    </g>

    <!-- 3 NORMALIZACION -->
    <g transform="translate(488,120)">
      <rect width="196" height="238" rx="12" fill="#0d121c" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect x="0" y="0" width="196" height="4" rx="2" fill="#2dd4bf"/>
      <text x="18" y="34" fill="#2dd4bf" font-size="11" font-weight="700" letter-spacing="1.5">03 · NORMALIZACIÓN</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">Un idioma común</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">Todo cae a OCSF-lite: mismo</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">nombre de campo venga de</text>
      <text x="18" y="126" fill="#8b98ad" font-size="11.5">donde venga. Aquí se</text>
      <text x="18" y="143" fill="#8b98ad" font-size="11.5">canonizan usuario, equipo,</text>
      <text x="18" y="160" fill="#8b98ad" font-size="11.5">ruta, dominio y hora.</text>
      <rect x="18" y="180" width="160" height="42" rx="6" fill="#0f1a1a" stroke="#0f766e"/>
      <text x="28" y="197" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="214" fill="#2dd4bf" font-size="11.5" font-family="Consolas, monospace">NormalizedEvent</text>
    </g>

    <!-- 4 EXTRACCION -->
    <g transform="translate(708,120)">
      <rect width="196" height="238" rx="12" fill="#0d121c" stroke="#1d2635"/>
      <rect x="0" y="0" width="196" height="4" rx="2" fill="#4ea8ff"/>
      <text x="18" y="34" fill="#4ea8ff" font-size="11" font-weight="700" letter-spacing="1.5">04 · EXTRACCIÓN</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">Cosas y vínculos</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">De cada evento salen</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">entidades (usuario, equipo,</text>
      <text x="18" y="126" fill="#8b98ad" font-size="11.5">proceso, fichero, IP…) y las</text>
      <text x="18" y="143" fill="#8b98ad" font-size="11.5">relaciones entre ellas, según</text>
      <text x="18" y="160" fill="#8b98ad" font-size="11.5">la ontología.</text>
      <rect x="18" y="180" width="160" height="42" rx="6" fill="#121927" stroke="#2a3547"/>
      <text x="28" y="197" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="214" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">nodos + aristas</text>
    </g>

    <!-- 5 FUSION -->
    <g transform="translate(928,120)">
      <rect width="196" height="238" rx="12" fill="#0d121c" stroke="#1d2635"/>
      <rect x="0" y="0" width="196" height="4" rx="2" fill="#fb923c"/>
      <text x="18" y="34" fill="#fb923c" font-size="11" font-weight="700" letter-spacing="1.5">05 · FUSIÓN</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">Lo mismo es uno</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">Tres pasadas, y solo cuando</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">no hay ambigüedad:</text>
      <text x="30" y="132" fill="#94a3b8" font-size="11.5">· IP → equipo</text>
      <text x="30" y="149" fill="#94a3b8" font-size="11.5">· fichero por hash</text>
      <text x="30" y="166" fill="#94a3b8" font-size="11.5">· proceso por nombre</text>
      <rect x="18" y="182" width="160" height="42" rx="6" fill="#121927" stroke="#2a3547"/>
      <text x="28" y="199" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="216" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">grafo sin duplicados</text>
    </g>

    <!-- 6 ENRIQUECIDO -->
    <g transform="translate(1148,120)">
      <rect width="164" height="238" rx="12" fill="#0d121c" stroke="#1d2635"/>
      <rect x="0" y="0" width="164" height="4" rx="2" fill="#ff2d55"/>
      <text x="18" y="34" fill="#ff2d55" font-size="11" font-weight="700" letter-spacing="1.5">06 · CRITERIO</text>
      <text x="18" y="62" fill="#dce4f0" font-size="15" font-weight="600">Qué significa</text>
      <text x="18" y="92" fill="#8b98ad" font-size="11.5">Riesgo, papel de cada</text>
      <text x="18" y="109" fill="#8b98ad" font-size="11.5">entidad, agrupación,</text>
      <text x="18" y="126" fill="#8b98ad" font-size="11.5">herramientas de ataque</text>
      <text x="18" y="143" fill="#8b98ad" font-size="11.5">y atribución.</text>
      <rect x="18" y="180" width="128" height="42" rx="6" fill="#121927" stroke="#2a3547"/>
      <text x="28" y="197" fill="#5b6880" font-size="10">SALE</text>
      <text x="28" y="214" fill="#94a3b8" font-size="11.5" font-family="Consolas, monospace">GraphDoc</text>
    </g>
  </g>

  <!-- flechas entre etapas -->
  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#f2)">
    <path d="M248,239 L263,239"/><path d="M468,239 L483,239"/><path d="M688,239 L703,239"/>
    <path d="M908,239 L923,239"/><path d="M1128,239 L1143,239"/>
  </g>

  <!-- ============ el ejemplo que atraviesa el carril ============ -->
  <rect x="48" y="390" width="1264" height="176" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="70" y="418" fill="#5b6880" font-size="11" letter-spacing="2">EL MISMO DATO, ETAPA A ETAPA</text>

  <g font-family="Consolas, Cascadia Mono, monospace" font-size="10.5">
    <!-- crudo -->
    <rect x="70" y="432" width="290" height="112" rx="6" fill="#121927" stroke="#2a3547"/>
    <text x="82" y="452" fill="#5b6880" font-size="10" font-family="Segoe UI, sans-serif">crudo · Splunk</text>
    <text x="82" y="472" fill="#94a3b8">_time: 1755594915</text>
    <text x="82" y="489" fill="#94a3b8">EventCode: 4688</text>
    <text x="82" y="506" fill="#94a3b8">ComputerName: WKS-0421</text>
    <text x="82" y="523" fill="#94a3b8">User: CORP\jlopez</text>
    <text x="82" y="538" fill="#94a3b8">New_Process: powershell.exe</text>

    <!-- normalizado -->
    <rect x="392" y="432" width="290" height="112" rx="6" fill="#0f1a1a" stroke="#0f766e"/>
    <text x="404" y="452" fill="#2dd4bf" font-size="10" font-family="Segoe UI, sans-serif">normalizado · OCSF-lite</text>
    <text x="404" y="472" fill="#94a3b8">time: 2026-08-19T09:15:15Z</text>
    <text x="404" y="489" fill="#94a3b8">class_name: Process Activity</text>
    <text x="404" y="506" fill="#94a3b8">device.hostname: wks-0421</text>
    <text x="404" y="523" fill="#94a3b8">actor.user: jlopez</text>
    <text x="404" y="538" fill="#94a3b8">process.name: powershell.exe</text>

    <!-- grafo -->
    <rect x="714" y="432" width="290" height="112" rx="6" fill="#121927" stroke="#2a3547"/>
    <text x="726" y="452" fill="#5b6880" font-size="10" font-family="Segoe UI, sans-serif">grafo</text>
    <text x="726" y="472" fill="#94a3b8">user:jlopez ──ejecuta──▸</text>
    <text x="742" y="489" fill="#94a3b8">proc:powershell.exe</text>
    <text x="726" y="509" fill="#94a3b8">proc:powershell.exe ──en──▸</text>
    <text x="742" y="526" fill="#94a3b8">host:wks-0421</text>

    <!-- criterio -->
    <rect x="1036" y="432" width="256" height="112" rx="6" fill="#1a0f14" stroke="#7f1d1d" stroke-opacity="0.6"/>
    <text x="1048" y="452" fill="#ff8fa3" font-size="10" font-family="Segoe UI, sans-serif">con criterio</text>
    <text x="1048" y="472" fill="#94a3b8">riesgo: 82</text>
    <text x="1048" y="489" fill="#94a3b8">papel: víctima</text>
    <text x="1048" y="506" fill="#94a3b8">táctica: execution</text>
    <text x="1048" y="523" fill="#94a3b8">figura: puesto de trabajo</text>
    <text x="1048" y="538" fill="#94a3b8">herramienta: PowerShell</text>
  </g>

  <g stroke="#5b6880" stroke-width="1.5" fill="none" marker-end="url(#f2g)" opacity="0.8">
    <path d="M362,488 L387,488"/><path d="M684,488 L709,488"/><path d="M1006,488 L1031,488"/>
  </g>

  <!-- ============ decisiones de diseño ============ -->
  <rect x="48" y="596" width="620" height="188" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="70" y="624" fill="#5b6880" font-size="11" letter-spacing="2">POR QUÉ ASÍ Y NO DE OTRA MANERA</text>
  <g font-size="12" fill="#8b98ad">
    <text x="70" y="652"><tspan fill="#2dd4bf">▸</tspan> <tspan fill="#dce4f0">Normalizar antes de extraer.</tspan> Si no, cada</text>
    <text x="86" y="670">normalizador tendría que saber de grafos.</text>
    <text x="70" y="696"><tspan fill="#2dd4bf">▸</tspan> <tspan fill="#dce4f0">Fusionar después de extraer.</tspan> Solo entonces</text>
    <text x="86" y="714">se ve que dos nodos eran la misma máquina.</text>
    <text x="70" y="740"><tspan fill="#2dd4bf">▸</tspan> <tspan fill="#dce4f0">El criterio va al final.</tspan> Riesgo y atribución</text>
    <text x="86" y="758">necesitan el grafo entero, no un evento suelto.</text>
    <text x="70" y="778" fill="#5b6880" font-size="11.5">Todo es determinista: mismos logs, mismo grafo, mismo informe.</text>
  </g>

  <!-- ============ lo que se descarta ============ -->
  <rect x="692" y="596" width="620" height="188" rx="12" fill="#0d121c" stroke="#1d2635"/>
  <text x="714" y="624" fill="#5b6880" font-size="11" letter-spacing="2">DÓNDE SE PIERDE VOLUMEN — Y ESTÁ BIEN</text>

  <!-- embudo -->
  <g transform="translate(714,640)">
    <rect x="0" y="0" width="420" height="22" rx="4" fill="#1e3a5f"/>
    <text x="430" y="16" fill="#94a3b8" font-size="11.5">registros leídos</text>
    <rect x="0" y="34" width="352" height="22" rx="4" fill="#1d4ed8" opacity="0.75"/>
    <text x="430" y="50" fill="#94a3b8" font-size="11.5">los reconoce un normalizador</text>
    <rect x="0" y="68" width="300" height="22" rx="4" fill="#0f766e"/>
    <text x="430" y="84" fill="#94a3b8" font-size="11.5">con hora y entidad utilizables</text>
    <rect x="0" y="102" width="190" height="22" rx="4" fill="#2dd4bf" opacity="0.85"/>
    <text x="430" y="118" fill="#94a3b8" font-size="11.5">nodos tras fusionar duplicados</text>
  </g>
  <text x="714" y="778" fill="#5b6880" font-size="11.5">Lo descartado se cuenta y se enseña: un embudo mudo esconde errores de parseo.</text>
</svg>
